name: Build Release APK

on:
  push:
    tags:
      - 'nx2-android-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ matrix.os }}
        max-size: 2G

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y glslang-tools ninja-build
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;4.1.0" || true

    - name: Make gradlew executable
      run: chmod +x src/android/gradlew

    - name: Decode and setup keystore
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/release.keystore
        echo "ANDROID_KEYSTORE_FILE=$HOME/.android/release.keystore" >> $GITHUB_ENV

    - name: Build Release APK
      working-directory: src/android
      run: |
        ./gradlew assembleMainlineRelease --no-daemon --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
        ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.0.12077973
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    - name: Verify APK was built
      run: |
        APK_PATH="src/android/app/build/outputs/apk/mainline/release/app-mainline-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "ERROR: APK not found at $APK_PATH"
          ls -la src/android/app/build/outputs/apk/mainline/release/ || echo "Directory does not exist"
          exit 1
        fi
        echo "APK found: $(ls -lh $APK_PATH)"

    - name: Rename APK
      run: |
        VERSION=${GITHUB_REF#refs/tags/nx2-android-v}
        if [ -z "$VERSION" ]; then VERSION="dev"; fi
        APK_SOURCE="src/android/app/build/outputs/apk/mainline/release/app-mainline-release.apk"
        APK_DEST="eden-sx2a-v${VERSION}.apk"
        cp "$APK_SOURCE" "$APK_DEST"
        echo "APK renamed to: $(ls -lh $APK_DEST)"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: eden-sx2a-release
        path: eden-sx2a-v*.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: eden-sx2a-v*.apk
        body: |
          ## 🎮 Eden SX2A v${{ github.ref_name }}

          ### ✨ What's New
          - Fixed loose ExeFS game detection
          - Direct detection of exefs/main folders
          - Improved recursive folder scanning

          ### 📦 Installation
          1. Download `eden-sx2a-v*.apk`
          2. Install on Android 13+ device (16GB RAM recommended)
          3. Grant All Files Access when prompted
          4. Add your game folders in Settings

          ### 🔧 Technical Details
          - Built with GitHub Actions + ccache
          - Signed with RSA 4096
          - Based on PokeDinner 2.0.0

          Built from: `${{ github.sha }}`

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
