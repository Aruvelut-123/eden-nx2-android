name: Build Release APK

on:
  push:
    tags:
      - 'nx2-android-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ matrix.os }}
        max-size: 2G

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y glslang-tools ninja-build
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;4.1.0" || true

    - name: Make gradlew executable
      run: chmod +x src/android/gradlew

    - name: Build Release APK
      working-directory: src/android
      run: |
        ./gradlew assembleMainlineRelease --no-daemon --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
        ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.0.12077973
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache

    - name: Sign APK with jarsigner
      working-directory: src/android/app/build/outputs/apk/mainline/release
      run: |
        # Generate keystore
        keytool -genkey -v -keystore release.keystore \
          -alias eden_key -keyalg RSA -keysize 4096 -validity 10000 \
          -storepass "EdenSecure2026!" \
          -keypass "EdenSecure2026!" \
          -dname "CN=Eden SX2A, OU=Development, O=Eden Project, L=Madrid, ST=Madrid, C=ES"

        # Sign with jarsigner (more reliable)
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore release.keystore \
          -storepass "EdenSecure2026!" \
          -keypass "EdenSecure2026!" \
          app-mainline-release-unsigned.apk eden_key

        # Align APK
        zipalign -v 4 app-mainline-release-unsigned.apk app-mainline-release-signed.apk

    - name: Rename APK
      run: |
        VERSION=${GITHUB_REF#refs/tags/nx2-android-v}
        if [ -z "$VERSION" ]; then VERSION="dev"; fi
        cp src/android/app/build/outputs/apk/mainline/release/app-mainline-release-signed.apk \
           eden-sx2a-v${VERSION}.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: eden-sx2a-release
        path: eden-sx2a-v*.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: eden-sx2a-v*.apk
        body: |
          ## 🎮 Eden SX2A v${{ github.ref_name }}

          ### ✨ What's New
          - Fixed loose ExeFS game detection
          - Direct detection of exefs/main folders
          - Improved recursive folder scanning

          ### 📦 Installation
          1. Download `eden-sx2a-v*.apk`
          2. Install on Android 13+ device (16GB RAM recommended)
          3. Grant All Files Access when prompted
          4. Add your game folders in Settings

          ### 🔧 Technical Details
          - Built with GitHub Actions + ccache
          - Signed with RSA 4096
          - Based on PokeDinner 2.0.0

          Built from: `${{ github.sha }}`

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
